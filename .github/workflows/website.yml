name: Website contracts

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Only this repository's dev-to-main promotion has a matching dev push run.
    if: github.event_name != 'pull_request' || github.head_ref != 'dev' || github.base_ref != 'main' || github.event.pull_request.head.repo.id != github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Verify workflow event boundaries
        run: node --test test/workflow.test.mjs
      - name: Run scene tests
        run: npm run test:scene
      - name: Run PostHog contracts
        run: npm run test:posthog
      - name: Run support contracts
        run: npm run test:support
      - name: Build production app
        run: npm run build
      - name: Install browser for production checks
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify production page and API boundaries
        run: npm run test:browser
