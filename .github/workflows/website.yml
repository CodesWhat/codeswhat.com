name: Website contracts

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR so a superseded head is cancelled. Push runs get
  # a unique group so a queued dev/main run is never replaced by a newer push.
  group: website-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Verify workflow event boundaries
        run: node --test test/workflow.test.mjs
      - name: Run scene tests
        run: npm run test:scene
      - name: Run PostHog contracts
        run: npm run test:posthog
      - name: Run support contracts
        run: npm run test:support
      - name: Run subscribe verification contracts
        run: npm run test:subscribe
      - name: Build production app
        # Cloudflare's published always-pass test site key; the browser checks
        # need the widget compiled in. Real keys live only in Vercel.
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Install browsers for production checks
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - name: Verify production page and API boundaries (Chromium, Firefox, WebKit)
        run: npm run test:browser:all
